<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance - RR Fluid Engineering</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f7ff;
}

.header{
background:#0b3d91;
color:white;
padding:20px;
text-align:center;
}

.box{
background:white;
margin:20px;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#0b3d91;
color:white;
border:none;
border-radius:8px;
font-size:16px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#0b3d91;
color:white;
}

</style>

</head>

<body>

<div class="header">

<h1>RR Fluid Engineering Pvt. Ltd.</h1>
<h3>Attendance System</h3>

</div>


<div class="box">

<h2>Mark Attendance</h2>

<input type="text" placeholder="Employee Name">

<input type="date">

<label>Check In</label>
<input type="time">

<label>Check Out</label>
<input type="time">


<button>
Submit Attendance
</button>

</div>



<div class="box">

<h2>Attendance Record</h2>

<table>

<tr>
<th>Name</th>
<th>Date</th>
<th>In</th>
<th>Out</th>
</tr>

<tr>
<td>Employee 1</td>
<td>01-01-2026</td>
<td>09:00</td>
<td>18:00</td>
</tr>

</table>

</div>


</body>
</html>
