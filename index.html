<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RR Fluid Engineering Pvt. Ltd.</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

header{
background:#0b3d91;
color:white;
padding:20px;
text-align:center;
}

header img{
width:120px;
margin-bottom:10px;
border-radius:10px;
}

.hero{
padding:40px 20px;
text-align:center;
background:linear-gradient(135deg,#007bff,#00c6ff);
color:white;
}

.hero h1{
font-size:35px;
margin-bottom:10px;
}

.hero p{
font-size:18px;
margin-bottom:20px;
}

.btn{
display:inline-block;
padding:14px 30px;
background:white;
color:#0b3d91;
border-radius:30px;
text-decoration:none;
font-weight:bold;
}

.cards{
padding:20px;
display:grid;
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
color:#0b3d91;
margin-bottom:10px;
}

footer{
background:#0b3d91;
color:white;
text-align:center;
padding:15px;
margin-top:30px;
}
</style>

</head>

<body>

<header>

<h1>RR Fluid Engineering Pvt. Ltd.</h1>

</header>

<section class="hero">

<h1>Welcome</h1>

<p>Employee Management ERP System</p>

<a href="#" class="btn">Employee Login</a>

</section>

<div class="cards">

<div class="card">
<h2>Attendance</h2>
<p>Employee Daily Attendance</p>
</div>

<div class="card">
<h2>Expenses</h2>
<p>Food, Travel, Stay & Wages</p>
</div>

<div class="card">
<h2>Admin Panel</h2>
<p>Manage Employees & Reports</p>
</div>

</div>

<footer>

© 2026 RR Fluid Engineering Pvt. Ltd.

</footer>

</body>
</html>
