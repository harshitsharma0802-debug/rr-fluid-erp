<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expense Management</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f3f7ff;
}

.header{
background:#0b3d91;
color:white;
padding:20px;
text-align:center;
}

.box{
background:white;
margin:20px;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

input,textarea{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
background:#0b3d91;
color:white;
border:none;
border-radius:8px;
font-size:16px;
}

</style>

</head>


<body>


<div class="header">

<h1>RR Fluid Engineering Pvt. Ltd.</h1>
<h3>Expense Management</h3>

</div>



<div class="box">

<h2>Submit Expense</h2>


<input placeholder="Employee Name">


<input placeholder="Project / Site Name">


<input type="number" placeholder="Wages">


<input type="number" placeholder="Food Expense">


<input type="number" placeholder="Travel Expense">


<input type="number" placeholder="Stay Expense">


<input type="number" placeholder="Rent Expense">


<input type="number" placeholder="Other Expense">


<textarea placeholder="Description"></textarea>


<label>Upload Bill</label>

<input type="file">


<button>
Submit Expense
</button>


</div>


</body>

</html>
